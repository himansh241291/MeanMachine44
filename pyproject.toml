[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meanmachine44"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pandas>=2.0", "requests>=2.31", "yfinance>=0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
